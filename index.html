/* Repair: brighter, readable dark-gold theme, with a decorative scenic atmosphere. */
html,body{background:#121820!important;color:#fff0d0!important}
#app{background:radial-gradient(ellipse at 50% 2%,#28394a 0%,#121b24 48%,#0b1118 100%);min-height:100vh}
.top{background:#111a23f5;border-bottom-color:#8b6d3d}
.hero{min-height:365px;background:radial-gradient(ellipse at 50% 65%,#304656 0%,transparent 55%),linear-gradient(180deg,#1d303d 0%,#121c27 60%,#263642 100%);box-shadow:inset 0 0 70px #05090c,0 9px 30px #0005}
.hero:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-9px;height:100px;background:linear-gradient(155deg,transparent 35%,#17232c 35% 45%,transparent 45%),linear-gradient(25deg,transparent 37%,#34434a 37% 47%,transparent 47%),linear-gradient(170deg,transparent 48%,#263642 48% 65%,transparent 65%);opacity:.8;pointer-events:none}
.hero>*{position:relative;z-index:1}.hero h1{color:#ffe2a0;text-shadow:0 2px 15px #000}
.tile{background:linear-gradient(155deg,#253441,#141e29);border-color:#c19a54;color:#fff0d1;box-shadow:0 5px 15px #0004}
.tile small{color:#d2c1a5}.panel{background:linear-gradient(150deg,#233341,#131d27);border-color:#ac8649}
.library-item{background:#1e2b37;border-color:#977443}.notice{background:#23303b;color:#e0d2b8}
@media(max-width:390px){.tile{min-height:129px}.hero{min-height:325px}}

</style></head><body><div id="app"><header class="top"><span class="back">☯</span><span class="brand">S I CHING</span><span class="topicon">✧</span></header><main class="content"><div class="hero"><h1>S I CHING</h1><p>ĐÔNG PHƯƠNG HUYỀN HỌC</p><div class="hero-art" role="img" aria-label="Đồ hình bát quái trên nền sơn thủy"></div><p>Minh cổ pháp · Tường thiên cơ</p></div><h2 class="section-title">Lục môn huyền học</h2><div class="tiles"><button class="tile" onclick="setScreen('module',0)"><span class="symbol">☯</span><b>Kinh Dịch</b><small>64 quẻ · Hào từ</small></button><button class="tile" onclick="setScreen('module',1)"><span class="symbol">✿</span><b>Mai Hoa Dịch Số</b><small>Tượng · Số · Lý</small></button><button class="tile" onclick="setScreen('module',2)"><span class="symbol">◉</span><b>Quỷ Cốc Tử</b><small>Mệnh pháp · Cổ quyết</small></button><button class="tile" onclick="setScreen('module',3)"><span class="symbol">▦</span><b>Kỳ Môn Độn Giáp</b><small>Cửu cung · Tam kỳ</small></button><button class="tile" onclick="setScreen('module',4)"><span class="symbol">◈</span><b>Đại Lục Nhâm</b><small>Tứ khóa · Tam truyền</small></button><button class="tile" onclick="setScreen('module',5)"><span class="symbol">✧</span><b>Tử Vi Đẩu Số</b><small>12 cung · Chính tinh</small></button></div><div class="notice">Bản mẫu giao diện. Các engine cổ pháp chưa được kiểm chứng đầy đủ.</div></main><nav class="nav"><button class="active" onclick="setScreen('home')"><i>⌂</i>Trang chủ</button><button onclick="setScreen('library')"><i>▣</i>Thư viện</button><button onclick="setScreen('journal')"><i>◷</i>Nhật ký</button><button onclick="setScreen('settings')"><i>⚙</i>Cài đặt</button></nav></div><script>
'use strict';const modules=[['☯','Kinh Dịch','64 quẻ · Hào từ'],['✿','Mai Hoa Dịch Số','Tượng · Số · Lý'],['◉','Quỷ Cốc Tử','Mệnh pháp · Cổ quyết'],['▦','Kỳ Môn Độn Giáp','Cửu cung · Tam kỳ'],['◈','Đại Lục Nhâm','Tứ khóa · Tam truyền'],['✧','Tử Vi Đẩu Số','12 cung · Chính tinh']];const app=document.getElementById('app');let screen='home',mod=0,tab=0,lines=[],history=[];try{history=JSON.parse(localStorage.getItem('siching-history')||'[]')}catch{}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function hex(ls){return '<div class="hex">'+ls.slice().reverse().map(v=>'<div class="line '+(v%2===0?'yin':'')+'"></div>').join('')+'</div>'}function setScreen(s,m){screen=s;if(m!==undefined)mod=m;tab=0;render();window.scrollTo(0,0)}function header(){return '<header class="top"><button class="back" onclick="setScreen(\'home\')">'+(screen==='home'?'☯':'‹')+'</button><span class="brand">'+(screen==='home'?'S I CHING':screen==='module'?modules[mod][1]:screen==='library'?'Thư viện':screen==='journal'?'Nhật ký':'Cài đặt')+'</span><span class="topicon">✧</span></header>'}function nav(){return '<nav class="nav">'+[['⌂','Trang chủ','home'],['▣','Thư viện','library'],['◷','Nhật ký','journal'],['⚙','Cài đặt','settings']].map(([ico,label,s])=>'<button class="'+(screen===s?'active':'')+'" onclick="setScreen(\''+s+'\')"><i>'+ico+'</i>'+label+'</button>').join('')+'</nav>'}function home(){return '<div class="hero"><h1>S I CHING</h1><p>ĐÔNG PHƯƠNG HUYỀN HỌC</p><div class="hero-art" role="img" aria-label="Đồ hình bát quái trên nền sơn thủy"></div><p>Minh cổ pháp · Tường thiên cơ</p></div><h2 class="section-title">Lục môn huyền học</h2><div class="tiles">'+modules.map(([icon,name,sub],i)=>'<button class="tile" onclick="setScreen(\'module\','+i+')"><span class="symbol">'+icon+'</span><b>'+name+'</b><small>'+sub+'</small></button>').join('')+'</div><div class="notice">Bản mẫu giao diện tương tác. Chưa tích hợp hoặc xác minh đầy đủ engine cổ pháp của sáu môn.</div>'}function tabs(names){return '<div class="tabs">'+names.map((n,i)=>'<button class="tab '+(tab===i?'active':'')+'" onclick="tab='+i+';render()">'+n+'</button>').join('')+'</div>'}function cast(){lines=[];castOne()}function castOne(){if(lines.length>=6)return;let x=new Uint32Array(3);if(window.crypto&&typeof window.crypto.getRandomValues==='function'){window.crypto.getRandomValues(x)}else{for(let j=0;j<3;j++)x[j]=Math.floor(Math.random()*4294967296)}lines.push(6+(x[0]&1)+(x[1]&1)+(x[2]&1));if(lines.length===6){history.unshift({time:new Date().toLocaleString('vi-VN'),lines:[...lines]});history=history.slice(0,100);try{localStorage.setItem('siching-history',JSON.stringify(history))}catch{}tab=1}render()}function iching(){let out=tabs(['Gieo quẻ','Kết quả','Luận giải']);if(tab===0)out+='<div class="panel" style="text-align:center"><h3>Gieo quẻ bằng 3 đồng tiền</h3><div class="coin-art" role="img" aria-label="Ba đồng tiền cổ trên khay gỗ"></div><p>Đặt tâm vào câu hỏi, sau đó gieo đủ sáu hào từ dưới lên.</p><p class="gold">Số hào đã gieo: '+lines.length+'/6</p>'+hex(lines)+'<button class="primary" onclick="'+(lines.length?'castOne()':'cast()')+'">'+(lines.length?'Gieo hào tiếp theo':'Bắt đầu gieo quẻ')+'</button>'+(lines.length?'<button class="secondary" onclick="lines=[];render()">Gieo lại</button>':'')+'</div>';else if(!lines.length)out+='<div class="panel"><p>Chưa có quẻ. Vui lòng gieo quẻ trước.</p><button class="primary" onclick="tab=0;render()">Bắt đầu</button></div>';else if(tab===1){let changed=lines.map(v=>v===6?7:v===9?8:v);out+='<div class="panel"><h3>Kết quả gieo quẻ</h3><div class="result-grid"><div><strong>Quẻ chủ</strong>'+hex(lines)+'</div><div class="arrow">→</div><div><strong>Quẻ biến</strong>'+hex(changed)+'</div></div><p>Hào động (tính từ dưới lên): '+(lines.map((v,i)=>v===6||v===9?i+1:null).filter(Boolean).join(', ')||'Không có')+'</p><div class="notice">Các hào được tạo theo phương pháp ba đồng tiền; bản mẫu chưa gán tên 64 quẻ hoặc luận đoán khi chưa có bộ dữ liệu cổ văn đã đối chiếu.</div><button class="primary" onclick="tab=2;render()">Xem thông tin luận giải</button></div>'}else out+='<div class="panel"><h3>Luận giải theo cổ pháp</h3><p>Để hiển thị Thoán từ, Tượng từ, hào từ và quy tắc chọn lời chính xác, cần tích hợp bộ dữ liệu 64 quẻ / 384 hào có đối chiếu nguồn.</p><details><summary>Nguyên tắc xác định quẻ</summary><p>Hào 6: âm động; hào 7: dương tĩnh; hào 8: âm tĩnh; hào 9: dương động. Sáu hào được xếp từ dưới lên.</p></details><details><summary>Hồ sơ nguồn</summary><p>Chưa có nguồn văn bản đã xác minh trong bản mẫu. Không sinh nội dung dự đoán giả.</p></details></div>';return out}function palaceGrid(){let labels=['Tốn','Ly','Khôn','Chấn','Trung cung','Đoài','Cấn','Khảm','Càn'];return '<div class="palaces">'+labels.map((n,i)=>'<div class="palace"><b>'+n+'</b><span>Vị trí '+(i+1)+'<br>Chưa an bàn</span></div>').join('')+'</div>'}function otherModule(){let isPalace=[3,4,5].includes(mod),names=mod===5?['Lá số','Đại hạn','Luận giải']:mod===3?['Lập cục','Bàn cục','Luận giải']:mod===4?['Lập khóa','Thiên bàn','Luận giải']:['Lập số','Kết quả','Luận giải'];let out=tabs(names);if(tab===0)out+='<div class="module-banner"></div><div class="panel"><h3>'+names[0]+' · '+modules[mod][1]+'</h3><div class="formrow"><label>Ngày sinh / thời điểm lập số</label><input type="datetime-local" id="dt"><label>Trường phái</label><select><option>Chưa cấu hình — cần chọn nguồn cổ pháp</option></select></div><button class="primary" onclick="alert(\'Chức năng an số chưa được tích hợp engine cổ pháp đã kiểm chứng.\')">'+names[0]+'</button><div class="notice">Không tạo lá số giả. Màn hình này là nguyên mẫu thiết kế, chờ engine và quy tắc trường phái được xác minh.</div></div>';else if(tab===1)out+='<div class="panel"><h3>'+names[1]+'</h3>'+(isPalace?palaceGrid():'<p>Chưa có dữ liệu tính toán được xác minh.</p>')+'<div class="notice">Bảng minh họa vị trí, không phải kết quả an số.</div></div>';else out+='<div class="panel"><h3>Luận giải chuyên sâu</h3><details><summary>Cổ văn và xuất xứ</summary><p>Chưa nhập dữ liệu cổ văn đã đối chiếu.</p></details><details><summary>Phân tích cách cục</summary><p>Cần có kết quả tính toán hợp lệ từ engine tương ứng.</p></details><details><summary>Kết luận và lời khuyên</summary><p>Chỉ hiển thị sau khi hoàn tất kiểm chứng quy tắc.</p></details></div>';return out}function library(){return '<div class="module-banner"></div><h2 class="section-title">Thư viện cổ học</h2>'+modules.map((m,i)=>'<button class="library-item" onclick="setScreen(\'module\','+i+')"><span><span class="gold">'+m[0]+'</span> &nbsp;'+m[1]+'</span><span class="gold">›</span></button>').join('')}function journal(){return '<h2 class="section-title">Nhật ký gieo quẻ</h2>'+(history.length?history.map((h,i)=>'<button class="library-item" onclick="lines=history['+i+'].lines;mod=0;screen=\'module\';tab=1;render()"><span><b class="gold">Quẻ gieo #'+(history.length-i)+'</b><br><small>'+esc(h.time)+'</small></span><span>›</span></button>').join(''):'<p class="empty">Chưa có lần gieo quẻ nào.</p>')}function settings(){return '<div class="module-banner"></div><h2 class="section-title">Cài đặt</h2><div class="panel"><h3>Thông tin ứng dụng</h3><p>S I CHING · Nguyên mẫu giao diện Hắc Kim</p><p>Chế độ: Offline, không thu thập thông tin cá nhân.</p></div><div class="panel"><h3>Dữ liệu cục bộ</h3><p>Nhật ký gieo quẻ được lưu trong trình duyệt trên thiết bị.</p><button class="secondary" onclick="if(confirm(\'Xóa toàn bộ nhật ký?\')){history=[];localStorage.removeItem(\'siching-history\');render()}">Xóa nhật ký</button></div><div class="notice">Bản mẫu chưa phải ứng dụng iOS được chứng nhận hoặc sẵn sàng gửi Apple Review.</div>'}function render(){app.innerHTML=header()+'<main class="content">'+(screen==='home'?home():screen==='module'?(mod===0?iching():otherModule()):screen==='library'?library():screen==='journal'?journal():settings())+'</main>'+nav()}try{render()}catch(e){document.getElementById('app').innerHTML='<div style="padding:35px;color:#f0c879"><h2>S I CHING</h2><p>Không thể khởi tạo giao diện.</p><pre style="white-space:pre-wrap">'+String(e.message||e)+'</pre></div>'}
</script></body></html>
